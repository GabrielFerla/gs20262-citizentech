# Pipeline de CI/CD: cada commit roda lint + testes de unidade, sobe o ambiente completo
# com docker compose e roda os testes de integração. Na branch main, publica as imagens
# no GitHub Container Registry (sem nenhum passo manual).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Lint e testes de unidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            area1-ia/requirements.txt
            area2-bigdata/ingestor/requirements.txt
            area3-mvp/iot/simuladores/requirements.txt

      - name: Instala dependências
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes de unidade
        run: python -m pytest --junitxml=relatorios/unitarios.xml

      - name: Guarda o relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-unitarios
          path: relatorios/

  integracao:
    name: Integração (docker compose)
    needs: qualidade
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configura o .env (histórico menor para o CI ser rápido)
        run: |
          cp .env.example .env
          sed -i 's/^HISTORICO_DIAS=.*/HISTORICO_DIAS=3/' .env

      - name: Sobe o ambiente
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Testes de integração
        run: docker compose --profile ferramentas run --rm --build testes

      - name: Exporta a camada gold (CSVs do Power BI)
        run: docker compose --profile ferramentas run --rm exportar

      - name: Logs dos serviços (se falhar)
        if: failure()
        run: docker compose logs --no-color

      - name: Guarda relatórios e CSVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-integracao-e-csvs
          path: |
            relatorios/
            area2-bigdata/powerbi/dados/

      - name: Derruba o ambiente
        if: always()
        run: docker compose down -v

  publicar:
    name: Publica imagens (GHCR)
    needs: integracao
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push das imagens
        run: |
          cp .env.example .env
          docker compose build ingestor simulador api
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          VERSAO="${GITHUB_SHA::7}"
          for nome in ingestor simulador ia; do
            for tag in "$VERSAO" latest; do
              docker tag "citizentech/$nome:local" "$REPO/$nome:$tag"
              docker push "$REPO/$nome:$tag"
            done
          done
