# Abriga — sensores → MQTT → ingestor → PostgreSQL (bronze/silver/gold) → API de IA → app
#
#   cp .env.example .env
#   docker compose up -d --build
#
# App do cidadão: http://localhost:5173 · Swagger da API: http://localhost:8000/docs
#
# Ferramentas (sob demanda):
#   docker compose --profile ferramentas run --rm exportar       # CSVs para o Power BI
#   docker compose --profile ferramentas run --rm ia-relatorio   # métricas e gráficos da IA
#   docker compose --profile ferramentas run --rm testes         # testes de integração
name: citizentech

x-banco: &banco
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-citizentech}

x-mqtt: &mqtt
  MQTT_HOST: mosquitto
  MQTT_PORT: "1883"

x-imagem-ingestor: &imagem-ingestor
  image: citizentech/ingestor:local
  build:
    context: .
    dockerfile: area2-bigdata/ingestor/Dockerfile

x-imagem-simulador: &imagem-simulador
  image: citizentech/simulador:local
  build:
    context: .
    dockerfile: area3-mvp/iot/simuladores/Dockerfile

x-imagem-ia: &imagem-ia
  image: citizentech/ia:local
  build:
    context: .
    dockerfile: area1-ia/Dockerfile

x-simulacao: &simulacao
  HISTORICO_DIAS: ${HISTORICO_DIAS:-30}
  SIM_SEMENTE: ${SIM_SEMENTE:-42}

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-citizentech}
      POSTGRES_USER: ${POSTGRES_USER:-migrador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    ports:
      # Só a própria máquina acessa (as senhas de exemplo estão no repositório público).
      - "127.0.0.1:55432:5432"
    volumes:
      # Postgres 18: o volume vai em /var/lib/postgresql (a imagem mudou a pasta de dados)
      - pg_dados:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    entrypoint: ["/bin/sh", "/mosquitto/config/entrypoint.sh"]
    environment:
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD:?defina no .env}
      MQTT_SIMULADOR_PASSWORD: ${MQTT_SIMULADOR_PASSWORD:?defina no .env}
      MQTT_PONTE_PASSWORD: ${MQTT_PONTE_PASSWORD:?defina no .env}
    ports:
      - "127.0.0.1:11883:1883"
    volumes:
      - ./area3-mvp/iot/mosquitto:/mosquitto/config:ro
      - mosquitto_dados:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u ingestor -P \"$$MQTT_INGESTOR_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s

  # Roda uma vez: cria tabelas/visões, carrega cadastros e define as senhas dos usuários do banco.
  migrar:
    <<: *imagem-ingestor
    command: ["python", "-m", "ingestor.migrar"]
    environment:
      <<: *banco
      POSTGRES_USER: ${POSTGRES_USER:-migrador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INGESTOR_DB_PASSWORD: ${INGESTOR_DB_PASSWORD:?defina no .env}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:?defina no .env}
      IA_DB_PASSWORD: ${IA_DB_PASSWORD:?defina no .env}
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  # Roda uma vez: gera a série histórica na zona de chegada do data lake (se ainda não existir).
  # O data lake fica no volume "datalake": "docker compose down -v" zera banco E data lake
  # juntos, e na próxima subida o histórico é gerado de novo terminando no horário atual.
  historico-gerar:
    <<: *imagem-simulador
    command: ["python", "-m", "simuladores.historico", "--se-nao-existir"]
    environment:
      <<: *simulacao
      LANDING_DIR: /dados/landing
    volumes:
      - datalake:/dados/landing
    healthcheck:
      disable: true

  # Roda uma vez: carrega os arquivos da zona de chegada (ignora os já carregados).
  historico-carregar:
    <<: *imagem-ingestor
    command: ["python", "-m", "ingestor.lote", "--pasta", "/dados/landing"]
    environment:
      <<: *banco
      INGESTOR_DB_PASSWORD: ${INGESTOR_DB_PASSWORD}
    volumes:
      - datalake:/dados/landing:ro
    healthcheck:
      disable: true
    depends_on:
      migrar:
        condition: service_completed_successfully
      historico-gerar:
        condition: service_completed_successfully

  # Tempo real: assina o MQTT e grava cada leitura.
  ingestor:
    <<: *imagem-ingestor
    restart: unless-stopped
    environment:
      <<: [*banco, *mqtt]
      INGESTOR_DB_PASSWORD: ${INGESTOR_DB_PASSWORD}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD}
    depends_on:
      migrar:
        condition: service_completed_successfully
      mosquitto:
        condition: service_healthy

  # Sensores simulados publicando em tempo real (acelerado para a demonstração).
  simulador:
    <<: *imagem-simulador
    restart: unless-stopped
    environment:
      <<: [*mqtt, *simulacao]
      MQTT_SIMULADOR_PASSWORD: ${MQTT_SIMULADOR_PASSWORD}
      SIM_CENARIO: ${SIM_CENARIO:-ciclo}
      SIM_VELOCIDADE: ${SIM_VELOCIDADE:-600}
    depends_on:
      ingestor:
        condition: service_healthy
      historico-carregar:
        condition: service_completed_successfully

  # Traz as leituras do ESP32 no Wokwi (broker público) para o broker local.
  #   docker compose --profile wokwi up -d ponte-wokwi
  ponte-wokwi:
    <<: *imagem-simulador
    profiles: ["wokwi"]
    command: ["python", "-m", "simuladores.ponte_wokwi"]
    restart: unless-stopped
    environment:
      <<: *mqtt
      MQTT_PONTE_PASSWORD: ${MQTT_PONTE_PASSWORD}
      WOKWI_BROKER: ${WOKWI_BROKER:-broker.hivemq.com}
      WOKWI_PREFIXO: ${WOKWI_PREFIXO:?defina WOKWI_PREFIXO no .env}
      WOKWI_CHAVE: ${WOKWI_CHAVE:-}
    depends_on:
      mosquitto:
        condition: service_healthy

  # IA (área 1): previsão do nível em 6 h, "onde ficar seguro" e mensagens de alerta.
  # O modelo é treinado no build da imagem; a API lê só a camada gold (usuário ia_ro).
  # Swagger em http://localhost:8000/docs
  api:
    <<: *imagem-ia
    restart: unless-stopped
    environment:
      <<: *banco
      IA_DB_PASSWORD: ${IA_DB_PASSWORD}
      # Só para o app em desenvolvimento (Metro em 8081); o app do Compose usa o proxy /api, sem CORS.
      API_CORS_ORIGENS: ${API_CORS_ORIGENS:-http://localhost:5173,http://localhost:8081}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrar:
        condition: service_completed_successfully
      historico-carregar:
        condition: service_completed_successfully

  # App do cidadão (área 3): Expo/React Native exportado para a web e servido pelo nginx (sem root).
  # http://localhost:5173 · o nginx repassa /api para a API, no mesmo endereço (não precisa de CORS).
  app:
    image: citizentech/app:local
    build:
      context: area3-mvp/app
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:8080"
    depends_on:
      api:
        condition: service_started

  # ---------------- ferramentas (sob demanda) ----------------
  # As ferramentas rodam como root para escrever na pasta do projeto montada como volume e, no fim,
  # devolvem os arquivos ao dono da pasta (no Linux, sem isso, eles ficariam com dono root).
  ia-relatorio:
    <<: *imagem-ia
    profiles: ["ferramentas"]
    # Grava em relatorios/ia (fora do git). A cópia de referência, citada no PDF, fica em area1-ia/relatorio.
    user: root
    command:
      - sh
      - -c
      - |
        python -m ia.relatorio --saida /relatorios/ia; s=$$?
        chown -R "$$(stat -c %u:%g /relatorios)" /relatorios/ia 2>/dev/null
        exit $$s
    environment:
      <<: *banco
      IA_DB_PASSWORD: ${IA_DB_PASSWORD}
    volumes:
      - ./relatorios:/relatorios
    healthcheck:
      disable: true
    depends_on:
      historico-carregar:
        condition: service_completed_successfully

  exportar:
    <<: *imagem-ingestor
    profiles: ["ferramentas"]
    user: root
    command:
      - sh
      - -c
      - |
        python -m ingestor.exportar --saida /powerbi/dados; s=$$?
        chown -R "$$(stat -c %u:%g /powerbi)" /powerbi/dados 2>/dev/null
        exit $$s
    environment:
      <<: *banco
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
    volumes:
      - ./area2-bigdata/powerbi:/powerbi
    healthcheck:
      disable: true
    depends_on:
      migrar:
        condition: service_completed_successfully

  testes:
    profiles: ["ferramentas"]
    image: citizentech/testes:local
    build:
      context: .
      dockerfile: area4-devops/testes/Dockerfile
    user: root  # grava o relatório JUnit em relatorios/ e devolve o arquivo ao dono da pasta (Dockerfile)
    environment:
      <<: [*banco, *mqtt]
      POSTGRES_USER: ${POSTGRES_USER:-migrador}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      INGESTOR_DB_PASSWORD: ${INGESTOR_DB_PASSWORD}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD}
      IA_DB_PASSWORD: ${IA_DB_PASSWORD}
      MQTT_INGESTOR_PASSWORD: ${MQTT_INGESTOR_PASSWORD}
      MQTT_SIMULADOR_PASSWORD: ${MQTT_SIMULADOR_PASSWORD}
      MQTT_PONTE_PASSWORD: ${MQTT_PONTE_PASSWORD}
      API_URL: http://api:8000
      APP_URL: http://app:8080
    volumes:
      - ./relatorios:/relatorios
    depends_on:
      simulador:
        condition: service_healthy
      api:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pg_dados:
  mosquitto_dados:
  datalake:
