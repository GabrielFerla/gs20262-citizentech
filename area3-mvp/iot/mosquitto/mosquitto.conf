# Broker MQTT do CitizenTech (Mosquitto 2)
# Sem "listener" o Mosquitto 2 só aceita conexões locais; por isso é declarado aqui.
listener 1883

# Segurança: ninguém conecta sem usuário e senha, e cada usuário só acessa os tópicos da ACL.
allow_anonymous false
password_file /mosquitto/data/passwd
acl_file /mosquitto/data/acl

# Mensagens maiores que 4 KB derrubam a conexão do cliente (proteção contra abuso).
max_packet_size 4096

# Guarda as mensagens QoS 1 do ingestor enquanto ele estiver fora do ar.
persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
