# App web do Abriga: arquivos do "expo export" + a API no mesmo endereço (/api → serviço api).
# Com a API no mesmo endereço, o navegador não precisa de CORS, e o app funciona aberto
# como localhost ou 127.0.0.1.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # DNS do Docker: resolve "api" de novo a cada 10 s (se a API reiniciar com outro IP,
    # o app continua achando). Com o nome numa variável, o nginx sobe mesmo com a API fora do ar.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-store" always;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
    }

    # Arquivos com o hash no nome: podem ficar em cache por muito tempo.
    location /_expo/static/ {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Aplicativo de página única: qualquer rota (/abrigo/abr-10, /rio/gua-cais...) abre o index.html.
    location / {
        include /etc/nginx/snippets/seguranca.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
