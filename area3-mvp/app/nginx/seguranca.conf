# Cabeçalhos de segurança do app web. Ficam num arquivo à parte porque o nginx não herda
# os add_header do server num location que tem add_header próprio.
#
# CSP: só arquivos e chamadas do próprio endereço. O 'unsafe-inline' em style-src é exigido
# pelo react-native-web, que gera os estilos na hora; scripts inline continuam proibidos.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# Localização só para o próprio app (e ela não sai do aparelho; veja src/logica/geo.ts).
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;
